<html noscrollbar>
	<title>Community Board</title>
	<body>
		<center>
		<br>
		<table width=720 height=100 cellpadding=0 cellspacing=0 border=0 background="L2UI_CH3.refinewnd_back_Pattern">
			<tr>
				<td fixwidth=720 fixheight=100 align=center valign=top>
					<table width=720 height=95 cellpadding=0 cellspacing=0 border=0>
						<tr>
							<td width=30></td>
							<td width=80 align=center valign=center>
								<img src="L2UI_CH3.tutorial_img12" width=64 height=64>
							</td>
							<td width=440 align=left valign=center>
								<font name="hs12" color="F2C75C">L2Journey</font><br1>
								<font color="AE9977">The journey never ends! Explore, conquer, and evolve.</font><br1>
								<font color="6B6B6B">Your adventure continues here, every day.</font>
							</td>
							<td width=180 align=center valign=center>
								<table cellpadding=0 cellspacing=1 border=0>
									<tr>
										<td bgcolor="222222" width=170 height=20 align=center>
											&nbsp;
										</td>
									</tr>
									<tr>
										<td bgcolor="1A1A1A" width=170 height=18 align=center>
											&nbsp;
										</td>
									</tr>
								</table>
							</td>
							<td width=10>&nbsp;</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<!-- TOP ROW: Buffer / BufferPremium / DropSearch / Teleport (gerado dinamicamente) -->
		%top_features_block%
		<br1>
		<!-- ROW: Raid Boss Watch + Hot Features (gerado dinamicamente; vazio se ambos desativados) -->
		<!-- MERCENARIES SECTION -->
		<table width=720 cellpadding=5 cellspacing=0 border=0 bgcolor="111111">
			<tr>
				<td align=center><font color="F2C75C"><b>Sistema de Mercenários (Single Player Healer)</b></font></td>
			</tr>
			<tr>
				<td align=center>
					<button value="Contratar Healer (1 Adena)" action="bypass _merc_hire" width=180 height=25 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
					<button value="Resetar Contrato / Reload (1 Adena)" action="bypass _merc_reload" width=220 height=25 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
					<button value="Seguir" action="bypass _merc_follow" width=80 height=25 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
					<button value="Ancorar" action="bypass _merc_anchor" width=80 height=25 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
		</table>
		<br1>
		%tip_block%
	</body>
</html>
